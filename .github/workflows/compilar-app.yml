name: Compilar app (iPhone .ipa + Android .apk)

# Se ejecuta con cada cambio de la app en `main` y también a mano desde
# Actions → "Compilar app" → Run workflow.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/compilar-app.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      modelo_url:
        description: 'URL directa de mobilefacenet.tflite (opcional: también sirve el secreto MODELO_TFLITE_URL o el archivo en el repo)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  verificar:
    name: Análisis y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  ios:
    name: iPhone (.ipa)
    needs: verificar
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Modelo de reconocimiento facial
        env:
          MODELO_URL: ${{ github.event.inputs.modelo_url || secrets.MODELO_TFLITE_URL }}
        run: bash ../.github/scripts/modelo.sh

      - run: flutter pub get

      - name: ¿Hay certificado de Apple?
        id: firma
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
        run: |
          if [ -n "$IOS_P12_BASE64" ]; then echo "modo=firmado" >> "$GITHUB_OUTPUT"; else echo "modo=sin-firmar" >> "$GITHUB_OUTPUT"; fi

      # Sin cuenta de desarrollador: .ipa sin firmar para instalar con Sideloadly / AltStore.
      - name: Compilar .ipa sin firmar
        if: steps.firma.outputs.modo == 'sin-firmar'
        run: |
          flutter build ios --release --no-codesign --build-number ${{ github.run_number }}
          mkdir -p ../salida/Payload
          cp -R build/ios/iphoneos/Runner.app ../salida/Payload/
          (cd ../salida && zip -qry ControlPersonal-iOS-sin-firmar.ipa Payload && rm -rf Payload)

      # Con cuenta de desarrollador: .ipa firmado (ad hoc / desarrollo / empresa).
      - name: Instalar certificado y perfil de aprovisionamiento
        if: steps.firma.outputs.modo == 'firmado'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_BASE64: ${{ secrets.IOS_PROVISION_BASE64 }}
        run: bash ../.github/scripts/firma_ios.sh

      - name: Compilar .ipa firmado
        if: steps.firma.outputs.modo == 'firmado'
        run: |
          flutter build ipa --release --build-number ${{ github.run_number }} \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p ../salida
          cp build/ios/ipa/*.ipa ../salida/ControlPersonal-iOS.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ControlPersonal-iOS
          path: salida/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Limpiar llavero
        if: always() && steps.firma.outputs.modo == 'firmado'
        run: security delete-keychain "$RUNNER_TEMP/firma.keychain-db" || true

  android:
    name: Android (.apk)
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Modelo de reconocimiento facial
        env:
          MODELO_URL: ${{ github.event.inputs.modelo_url || secrets.MODELO_TFLITE_URL }}
        run: bash ../.github/scripts/modelo.sh
      - run: flutter pub get
      - run: flutter build apk --release --build-number ${{ github.run_number }}
      - run: |
          mkdir -p ../salida
          cp build/app/outputs/flutter-apk/app-release.apk ../salida/ControlPersonal-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ControlPersonal-Android
          path: salida/*.apk
          if-no-files-found: error
          retention-days: 30

  # Deja los instaladores en un Release "ultima" para descargarlos desde el teléfono.
  publicar:
    name: Publicar descargas
    needs: [ios, android]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.ios.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: salida
          merge-multiple: true
      - name: Crear Release "ultima"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la salida
          gh release delete ultima --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create ultima salida/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Última compilación · #${{ github.run_number }}" \
            --notes "Compilado automáticamente desde ${GITHUB_SHA::7}.

          **Android:** descarga \`ControlPersonal-Android.apk\` en el teléfono e instálalo.
          **iPhone:** \`ControlPersonal-iOS-sin-firmar.ipa\` se instala con Sideloadly o AltStore (ver README). Si configuraste tu certificado de Apple, \`ControlPersonal-iOS.ipa\` ya viene firmado."
